name: 构建 Windows 本地可执行文件 (EXE)

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击一键打包
  push:
    tags:
      - 'v*' # 当推送版本标签如 v1.0.0 时自动触发构建
    branches:
      - main
      - master

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装项目依赖
        run: npm ci

      - name: 安装 Electron 打包构建器
        run: npm install --no-save electron electron-builder

      - name: 构建 Vite 前端静态包
        run: npm run build

      - name: 打包 Windows EXE 文件
        run: npx electron-builder --win --x64

      - name: 上传构建产物 (EXE) 到 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApexFlow-Windows-EXE
          path: dist-electron/*.exe
          retention-days: 30

      - name: 创建 GitHub Release 供用户直接下载
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
